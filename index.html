<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวัสดีชาวโลก สีรุ้ง</title>
    <style>
        .rainbow-text {
            font-size: 40px;
            font-weight: bold;
            /* ไล่สีรุ้ง 7 สี: แดง ส้ม เหลือง เขียว ฟ้า น้ำเงิน ม่วง */
            background-image: linear-gradient(
                to right, 
                #FF0000, 
                #FF7F00, 
                #FFFF00, 
                #00FF00, 
                #00FFFF, 
                #0000FF, 
                #8B00FF
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1 class="rainbow-text">สวัสดีชาวโลก</h1>

</body>
</html>
